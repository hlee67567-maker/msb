<style>
:root {
  color-scheme: light;
  --paper: #faf8ff;
  --ink: #200d37;
  --muted: #5f5370;
  --line: #dfd5eb;
  --violet: #5324ce;
  --lime: #e8ff6d;
  font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-synthesis: none;
  background: var(--paper);
  color: var(--ink);
}
* { box-sizing: border-box; }
body { margin: 0; }
button, a { font: inherit; }
button { cursor: pointer; }
a { color: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--violet); outline-offset: 4px; }
[tabindex="-1"]:focus { outline: none; }
.frame { width: min(100%, 1180px); margin: auto; padding-inline: clamp(16px, 5vw, 56px); }
.site-header, .site-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.site-header { min-height: 82px; border-bottom: 1px solid var(--line); }
.site-footer { border-top: 1px solid var(--line); padding: 15px 0 22px; color: var(--muted); font-size: .85rem; }
.brand { display: inline-flex; align-items: center; gap: 9px; padding: 0; border: 0; color: inherit; background: transparent; text-align: left; }
.brand-icon { flex: none; width: 42px; height: 42px; display: block; }
.wordmark { display: grid; gap: 2px; font-size: 1.05rem; font-weight: 950; letter-spacing: -.045em; line-height: 1; }
.wordmark small, .mono { font: 800 .76rem ui-monospace, monospace; letter-spacing: .08em; }
.wordmark small { color:var(--violet); white-space:nowrap; }
.daily-note { display:grid; justify-items:end; gap:3px; max-width:min(53%,19rem); margin:0; padding:6px 9px; border-radius:10px; background:#fcf0f3; text-align:right; line-height:1.36; }
.daily-note time { color:#874663; font-size:.73rem; font-weight:850; }
.daily-note span { font-size: clamp(.83rem, 2.4vw, .98rem); font-weight: 750; text-wrap: pretty; }
.stage { min-height: calc(100svh - 140px); padding: clamp(31px, 5.6vw, 68px) 0 clamp(42px, 6vw, 72px); display: grid; align-items: center; }
.intro { display:grid; justify-items:center; gap:clamp(23px,3.6vw,34px); margin:0 0 clamp(23px,4vw,38px); text-align:center; }
.intro h1 { font-size: clamp(2.05rem, 5.6vw, 4.55rem); line-height: 1.05; letter-spacing: -.09em; margin: 0; font-weight: 950; }
.intro h1 span { color: var(--violet); display: inline-block; }
.lede { color:var(--muted); font-size:1rem; line-height:1.65; margin:10px 0 0; }



.office-window {
  --ink:#684558;
  margin:0; width:min(100%,590px); min-width:0; padding:6px; border:2px solid #bb7997; border-radius:28px;
  overflow:hidden; background:#fff5e8; box-shadow:0 6px 0 #eec4d2,0 14px 24px #9d55751b;
}
.window-sign {
  display:flex; align-items:center; justify-content:center; gap:10px; padding:7px 12px 9px;
  color:#75465e; font-size:.91rem; font-weight:900; letter-spacing:.08em;
}
.window-sign::before, .window-sign::after {
  content:""; width:7px; aspect-ratio:1; border-radius:50%; background:#eab3ca;
  box-shadow:0 0 0 3px #f7dce6;
}
.window-scene {
  position:relative; isolation:isolate; overflow:hidden; aspect-ratio:2.18; min-height:143px;
  border:1.5px solid #bc86a2; border-radius:20px 20px 15px 15px;
  background:radial-gradient(circle at 6px 6px,#d892b027 1.1px,transparent 1.4px) 0 0/22px 22px,
    linear-gradient(164deg,#fff7eb 9%,#ffe8f0 72%,#f7e1f4);
}
.window-scene::after {
  content:""; position:absolute; z-index:1; inset:0; opacity:0; pointer-events:none; background:#7f65b533;
}
.office-window.is-lamp-off .window-scene::after { opacity:.68; }
.back-window {
  position:absolute; left:7%; top:17%; width:28%; height:43%; overflow:hidden;
  border:2px solid #9e6782; border-radius:60px 60px 9px 9px; background:linear-gradient(#c5e4fa,#edf6ff);
  box-shadow:0 3px 0 #aa749330,inset 0 0 0 3px #fff4df;
}
.back-window::before {
  content:""; position:absolute; top:17%; right:17%; width:23%; aspect-ratio:1;
  border-radius:50%; background:#ffe2a2; box-shadow:0 0 0 4px #fff2c380;
}
.back-window::after {
  content:""; position:absolute; inset:0;
  background:linear-gradient(90deg,transparent 49%,#ba809a 49% 51%,transparent 51%),
    linear-gradient(0deg,transparent 12%,#9cc6e665 12% 23%,transparent 23%);
}
.back-cloud { position:absolute; left:14%; top:47%; width:39%; height:17%; border-radius:99px; background:#fffdf8; }
.back-cloud::before { content:""; position:absolute; left:20%; bottom:20%; width:50%; aspect-ratio:1; border-radius:50%; background:inherit; }
.window-curtain {
  position:absolute; top:3%; left:1%; height:71%; width:26%; border-radius:70% 0 72% 8%;
  background:repeating-linear-gradient(105deg,#ffc0d7 0 5px,#f7a5c4 5px 6px);
  box-shadow:1px 1px #bc799590; transform:rotate(10deg);
}
.window-curtain + .window-curtain { left:auto; right:1%; transform:scaleX(-1) rotate(10deg); }
.window-star {
  position:absolute; left:39%; top:25%; color:#ba80a0; font-size:clamp(.85rem,3.3vw,1.2rem);
  line-height:1; text-shadow:12px 13px #e4a2b6;
}
.desk-top {
  position:absolute; inset:75% 0 auto; height:9%; z-index:1; border-block:1.5px solid #a96e7d;
  background:linear-gradient(#ffedc3 0 64%,#ffd9a8 64%);
}
.desk-front {
  position:absolute; inset:84% 0 0;
  background:repeating-linear-gradient(90deg,#dc7f9d37 0 12px,transparent 12px 24px),
    repeating-linear-gradient(0deg,#dc7f9d35 0 12px,transparent 12px 24px),#fff0e3;
}
.desk-front::after { content:""; position:absolute; inset:0 0 auto; height:2px; background:#a9667d34; }
.desk-lamp {
  position:absolute; z-index:2; left:45%; bottom:25%; width:20%; height:55%; min-width:44px; min-height:44px;
  padding:0; border:0; border-radius:12px; background:transparent; color:var(--ink);
}
.desk-lamp:focus-visible { outline-offset:2px; }
.desk-lamp::before {
  content:""; position:absolute; bottom:8%; left:43%; width:6%; height:88%;
  border:1px solid var(--ink); border-radius:99px; background:#bc93c5; transform:rotate(-19deg);
}
.desk-lamp::after {
  content:""; position:absolute; left:23%; bottom:0; width:57%; height:13%; border:1.5px solid var(--ink);
  border-radius:16px 16px 6px 6px; background:#dbb9e2; box-shadow:0 2px 0 #97617c38;
}
.lamp-shade {
  position:absolute; z-index:1; left:22%; top:3%; width:76%; height:31%;
  border:1.5px solid var(--ink); border-radius:70% 64% 13% 14%;
  background:repeating-linear-gradient(97deg,#f7b3c7 0 12px,#ffd5df 12px 19px);
  box-shadow:inset 0 2px 0 #fff4eb; transform:rotate(13deg);
}
.lamp-shade::after {
  content:""; position:absolute; inset:auto 0 -1px; height:27%; border:1px solid var(--ink);
  border-radius:50%; background:#ffe5a1; box-shadow:0 2px 7px #ffc7699c;
}
.lamp-pull {
  position:absolute; top:34%; left:77%; width:1px; height:21%; background:#916178; transform-origin:top;
}
.lamp-pull::after {
  content:""; position:absolute; left:-3px; bottom:-2px; width:7px; height:7px;
  border:1px solid #906479; border-radius:50%; background:#ffc98e;
}
.desk-lamp:hover .lamp-pull, .desk-lamp:focus-visible .lamp-pull { transform:rotate(-14deg); }
.lamp-glow {
  position:absolute; top:31%; left:48%; width:30%; height:46%; pointer-events:none;
  background:linear-gradient(166deg,#ffd5748f,transparent 90%); clip-path:polygon(14% 0,53% 0,100% 100%,0 100%);
}
.office-window.is-lamp-off .lamp-glow { opacity:0; }
.office-window.is-lamp-off .lamp-shade::after { background:#f6d7e2; box-shadow:none; }
.office-window.is-lamp-off .lamp-pull::after { background:#e5bfda; }
.desk-mug {
  position:absolute; left:63%; bottom:25%; width:8%; height:16%; border:1.5px solid var(--ink);
  border-radius:3px 3px 9px 9px; background:#b7e6d3;
}
.desk-mug::before { content:""; position:absolute; inset:-3px -1px auto; height:27%; border:1px solid var(--ink); border-radius:50%; background:#d99d72; }
.desk-mug::after { content:""; position:absolute; left:100%; top:13%; width:39%; height:56%; border:1.5px solid var(--ink); border-left:0; border-radius:0 6px 6px 0; }
.mug-steam {
  position:absolute; bottom:102%; left:28%; width:22%; height:54%; border-left:1.5px solid #755f9c; border-radius:57%;
  opacity:.45; pointer-events:none;
}
.mug-steam + .mug-steam { left:58%; height:47%; bottom:96%; }

.cat-button {
  position:absolute; z-index:2; left:2%; bottom:25%; width:14%; height:31%; min-width:44px; min-height:44px;
  padding:0; border:0; border-radius:9px; color:var(--ink); background:transparent;
}
.cat-button:focus-visible { outline-offset:1px; }

.desk-cat {
  --cat-fur:#ffe6cb;
  position:absolute; inset:auto 12% 0 16%; height:73%; border:1.5px solid var(--ink);
  border-radius:48% 48% 42% 42%;
  background:radial-gradient(ellipse at 15% 5%,#f5ad77 0 29%,transparent 31%),linear-gradient(150deg,#fff4df,var(--cat-fur));
  box-shadow:inset -3px -4px #f3ba9a60; transform-origin:50% 100%;
}
.cat-button:active .desk-cat { transform:scale(1.12,.84); }
.cat-heart {
  position:absolute; top:-4%; right:-9%; color:#b94b80; font-size:clamp(1rem,3vw,1.55rem); line-height:1;
  opacity:0; pointer-events:none;
}
.cat-button.is-pinched .cat-heart { opacity:1; }
.cat-ear {
  position:absolute; top:-19%; left:2%; width:35%; height:45%; transform:rotate(-8deg);
  clip-path:polygon(9% 0,98% 80%,1% 100%); background:var(--ink);
}
.cat-ear::before, .cat-ear::after { content:""; position:absolute; clip-path:inherit; }
.cat-ear::before { inset:1.4px; background:#f5ad77; }
.cat-ear::after { inset:4px 4px 3px; background:#f99fba; }
.cat-ear + .cat-ear { left:auto; right:2%; transform:scaleX(-1) rotate(-8deg); }
.cat-ear + .cat-ear::before { background:#ffebd5; }
.cat-eyes {
  position:absolute; inset:39% 20% auto; display:flex; justify-content:space-between; align-items:start;
}
.cat-eyes i {
  width:23%; aspect-ratio:.72; border-radius:50%;
  background:radial-gradient(circle at 62% 28%,#fff5e8 0 14%,transparent 18%),var(--ink);
}
.cat-button.is-pinched .cat-eyes i { transform:scaleY(.25); }
.cat-muzzle { position:absolute; top:55%; left:37%; width:26%; height:19%; }
.cat-muzzle::before, .cat-muzzle::after {
  content:""; position:absolute; top:30%; left:0; width:54%; height:59%;
  border-right:1px solid var(--ink); border-bottom:1px solid var(--ink); border-radius:0 0 63% 64%;
}
.cat-muzzle::after { left:auto; right:0; transform:scaleX(-1); }
.cat-muzzle i { position:absolute; z-index:1; top:0; left:31%; width:38%; height:38%; border-radius:50%; background:#bf7883; }
.cat-whiskers { position:absolute; top:56%; left:1%; width:17%; height:13%; }
.cat-whiskers + .cat-whiskers { left:auto; right:1%; transform:scaleX(-1); }
.cat-whiskers::before, .cat-whiskers::after {
  content:""; position:absolute; left:0; right:0; top:20%; height:1px; border-radius:99px; background:#ad7481; transform:rotate(13deg);
}
.cat-whiskers::after { top:68%; transform:rotate(-11deg); }
.cat-cheeks {
  position:absolute; top:56%; left:17%; width:15%; height:11%; border-radius:50%; background:#f5a4b7;
}
.cat-cheeks + .cat-cheeks { left:auto; right:17%; }
.cat-button.is-pinched .cat-cheeks { background:#f37499; }
.cat-paws {
  position:absolute; inset:auto 23% -1.5px; height:17%; display:flex; justify-content:space-between;
}
.cat-paws i { width:42%; border:1px solid #b88076; border-radius:60% 60% 46% 46%; background:#fff3da; }
.cat-tail {
  position:absolute; left:-27%; bottom:15%; width:32%; height:30%; border:1.5px solid var(--ink);
  border-radius:64% 0 0 45%; background:#f5ad77; transform:rotate(22deg); transform-origin:right bottom;
}
.duck-seesaw {
  position:absolute; z-index:2; left:max(17%,calc(2% + 46px)); bottom:25%; width:21%; height:31%; min-height:44px;
  padding:0; border:0; border-radius:8px; color:var(--ink); background:transparent;
}
.duck-seesaw:focus-visible { outline-offset:2px; }

.notebook-books {
  position:absolute; inset:auto 26% 0 26%; height:37%;

.notebook-books i {
  position:absolute; inset:auto 0 0; height:53%; min-height:7px;
  border:1.5px solid var(--ink); border-radius:4px 3px 3px 4px;

}

.seesaw-beam {

  background:linear-gradient(90deg,#9675e5 13%,transparent 13%),

}

.notebook-tab {

  border:1px solid var(--ink); border-radius:4px 4px 0 0; background:#ffbcd3;
}
.duck-seesaw:hover .notebook-tab, .duck-seesaw:focus-visible .notebook-tab { background:var(--lime); }
.desk-duck {
  position:absolute; right:8%; bottom:100%; width:32%; aspect-ratio:1.48; border:1px solid var(--ink);
  border-radius:52% 40% 58% 43%; background:#ffde77; transform:rotate(-10deg);
}
.duck-seesaw[aria-pressed="true"] .desk-duck { transform:rotate(10deg); }
.desk-duck::before {
  content:""; position:absolute; right:5%; top:-42%; width:48%; aspect-ratio:1; background:inherit; border:1px solid var(--ink); border-radius:50%;

function pickProfile(picks) {
  const scores = Object.create(null);
  picks.forEach(key => { scores[key] = (scores[key] || 0) + 1; });
  const highest = Math.max(...Object.values(scores));
  // The latest relevant answer breaks ties.
  return picks.slice().reverse().find(key => scores[key] === highest);
}

  ctx.fillRect(x, y, size, size);
  ctx.fillStyle = '#000';
  qrRows.forEach((row, r) => Array.from(row).forEach((dark, c) => {
    if (dark === '1') ctx.fillRect(x + margin + c * step, y + margin + r * step, step, step);
  }));
}
function roundedFill(ctx, x, y, w, h, radius) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.arcTo(x + w, y, x + w, y + h, radius);
  ctx.arcTo(x + w, y + h, x, y + h, radius);
  ctx.arcTo(x, y + h, x, y, radius);
  ctx.arcTo(x, y, x + w, y, radius);
  ctx.closePath();
  ctx.fill();
}
function drawLogo(ctx, x, y, size) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(size / 64, size / 64);
  ctx.fillStyle = '#5324ce';
  roundedFill(ctx, 0, 0, 64, 64, 18);
  ctx.fillStyle = '#e8ff6d';
  roundedFill(ctx, 16, 10, 32, 44, 6);
  ctx.fillStyle = '#200d37';
  roundedFill(ctx, 22, 23, 4, 6, 2);
  roundedFill(ctx, 38, 23, 4, 6, 2);
  roundedFill(ctx, 25, 43, 14, 2, 1);
  ctx.strokeStyle = '#200d37';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(26, 34);
  ctx.quadraticCurveTo(32, 40, 38, 34);
  ctx.stroke();
  ctx.restore();
}
function drawWrappedText(ctx, text, x, y, width, lineHeight) {
  let line = '';
  for (const character of text) {
    if (line && ctx.measureText(line + character).width > width) {
      ctx.fillText(line, x, y);
      y += lineHeight;
      line = '';
    }
    line += character;
  }
  if (line) ctx.fillText(line, x, y);
}
function drawCard(profile, receipt) {
  const canvas = document.createElement('canvas');
  canvas.width = 1080;
  canvas.height = 1440;
  const ctx = canvas.getContext('2d');
  const ink = '#200d37';
  const paper = '#fffdf8';
  ctx.fillStyle = '#f3eefb';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = ink;
  roundedFill(ctx, 45, 48, 1002, 1350, 48);
  roundedFill(ctx, 31, 31, 1002, 1350, 48);
  ctx.fillStyle = paper;
  roundedFill(ctx, 35, 35, 994, 1342, 44);
  ctx.fillStyle = profile.color;
  ctx.fillRect(35, 186, 994, 898);

  drawLogo(ctx, 77, 78, 68);
  ctx.fillStyle = ink;
  ctx.font = '900 36px system-ui, sans-serif';
  ctx.fillText('没事办事处', 164, 110);
  ctx.fillStyle = '#5324ce';
  ctx.font = '730 20px monospace';
  ctx.fillText('SMALL MATTERS', 166, 139);

  ctx.fillStyle = ink;
  ctx.font = '850 37px system-ui, sans-serif';
  ctx.fillText(receipt, 76, 274);
  ctx.strokeStyle = '#200d3780';
  ctx.lineWidth = 3;
  ctx.setLineDash([9, 10]);
  ctx.beginPath();
  ctx.arc(764, 487, 183, 0, 2 * Math.PI);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(44, 1084);
  ctx.lineTo(1020, 1084);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.beginPath();
  ctx.arc(775, 498, 145, 0, 2 * Math.PI);
  ctx.fill();
  ctx.fillStyle = paper;
  ctx.beginPath();
  ctx.arc(759, 482, 139, 0, 2 * Math.PI);
  ctx.fill();
  ctx.strokeStyle = ink;
  ctx.stroke();
  ctx.fillStyle = ink;
  ctx.font = '900 174px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(profile.symbol, 759, 484);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  ctx.font = '950 113px system-ui, sans-serif';
  ctx.fillText(profile.title, 72, 814, 936);
  ctx.fillStyle = '#432174';
  ctx.font = '800 38px system-ui, sans-serif';
  ctx.fillText(profile.insight, 77, 881, 925);
  ctx.fillStyle = ink;
  ctx.font = '740 45px system-ui, sans-serif';
  profile.line.split('\n').forEach((line, index) => ctx.fillText(line, 77, 956 + index * 62, 921));

  ctx.fillStyle = '#efe6ff';
  roundedFill(ctx, 76, 1118, 620, 217, 24);
  ctx.fillStyle = '#432174';
  ctx.font = '800 32px system-ui, sans-serif';
  ctx.fillText('办事员备注', 108, 1166);
  ctx.fillStyle = ink;
  ctx.font = '710 34px system-ui, sans-serif';
  drawWrappedText(ctx, profile.habit, 108, 1217, 554, 44);
  drawQr(ctx, 754, 1100, 230);
  ctx.fillStyle = '#432174';
  ctx.font = '800 26px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('扫码办自己的小事', 869, 1357);
  return canvas;
}
function previewCard() {
  const url = drawCard(selectedProfile, activeTest.receipt).toDataURL('image/png');
  const image = dialog.querySelector('img');
  const download = dialog.querySelector('a');
  image.src = url;
  download.href = url;
  download.download = selectedProfile.title + '·竖版.png';
  dialog.showModal();
}
async function share() {
  const notice = stage.querySelector('.notice');
  if (navigator.share) {
    try {
      await navigator.share({title:'没事办事处', text:'专办那些说起来没事的小事。', url:publicUrl});
      return;
    } catch (error) {
      if (error.name === 'AbortError') return;
    }
  }
  try {
    await navigator.clipboard.writeText(publicUrl);
    notice.textContent = '测试首页链接已复制。';
  } catch {
    notice.textContent = '可从地址栏复制大厅链接。';
  }
}
document.querySelector('.site-header .brand').addEventListener('click', () => home(true));
stage.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.dataset.test) {
    start(button.dataset.test);
    return;
  }
  if (button.dataset.answer) {
    answers[position++] = button.dataset.answer;
    if (position < activeTest.questions.length) quiz();
    else {
      const resultId = activeTest.pickResult ? activeTest.pickResult(answers) : pickProfile(answers);
      selectedProfile = activeTest.profiles[resultId];
      result();
    }
    return;
  }
  switch (button.dataset.action) {
    case 'jump-to-tests': {
      const choices = stage.querySelector('#hall-choices');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      choices.focus({preventScroll:true});
      choices.scrollIntoView({behavior:reducedMotion ? 'auto' : 'smooth',block:'start'});
      break;
    }
    case 'toggle-lamp': toggleLamp(button); break;
    case 'pinch-cat': pinchCat(button); break;
    case 'ride-seesaw': rideSeesaw(button); break;
    case 'water-flower': waterFlower(button); break;
    case 'next-batch': nextHallBatch(); break;
    case 'catalog': home(true); break;
    case 'restart': start(activeTestId); break;
    case 'back':
      if (position) {
        position--;
        quiz();
      } else home(true);
      break;
    case 'save': previewCard(); break;
    case 'share': share(); break;
  }
});
document.addEventListener('DOMContentLoaded', () => {
  const receiptKey = new URL(location.href).searchParams.get('receipt');
  const [testId, resultId, extra] = (receiptKey || '').split('/');
  if (extra !== undefined || !Object.hasOwn(tests, testId)
    || !Object.hasOwn(tests[testId].profiles, resultId)) {
    home();
    return;
  }
  activeTestId = testId;
  activeTest = tests[testId];
  selectedProfile = activeTest.profiles[resultId];
  result();
}, { once:true });

</script>
